spring:
  application:
    name: usuario-service
  datasource:
    url: ${USUARIO_DB_URL:jdbc:mysql://localhost:3306/db_usuario_service?createDatabaseIfNotExist=true}
    username: ${USUARIO_DB_USER:root}
    password: ${USUARIO_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    token-seconds: 3600
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

server:
  port: ${USUARIO_PORT:8083}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
